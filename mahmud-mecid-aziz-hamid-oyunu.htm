<!DOCTYPE html>

    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Performans ve Akıcılık Odaklı CSS */
        .draggable {
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
            will-change: transform;
            transform: translateZ(0);
            user-select: none;
            touch-action: none;
        }
        .draggable:active {
            cursor: grabbing;
            transform: scale(0.97) translateZ(0);
        }
        .drag-over {
            border-color: #f59e0b !important;
            background-color: #fffbeb !important;
            box-shadow: inset 0 0 15px rgba(245, 158, 11, 0.1);
        }
        .drop-zone {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 220px;
        }
        .item-enter {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* İnce detaylar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900 p-2 md:p-6">

            { t: "Ziraat, Baytar, Orman, Engelliler Okulları", s: "II. Abdülhamid" },
            { t: "Şükufezar (Kadın Dergisi)", s: "II. Abdülhamid" }
        ];

        let queue = [];
        let activeItems = [];
        const poolLimit = 5;
        let userMistakes = [];

        function init() {
            queue = [...database].sort(() => Math.random() - 0.5);
            document.getElementById('counter').textContent = queue.length;
            refillPool();
        }

        function refillPool() {
            const pool = document.getElementById('active-pool');
            while (activeItems.length < poolLimit && queue.length > 0) {
                const item = queue.pop();
                activeItems.push(item);
                const el = createDraggable(item);
                pool.appendChild(el);
            }
            document.getElementById('counter').textContent = queue.length + activeItems.length;
            
            if (queue.length === 0 && activeItems.length === 0) {
                document.getElementById('finish-btn').classList.remove('hidden');
            }
        }

        function createDraggable(item) {
            const el = document.createElement('div');
            el.className = 'draggable bg-white border border-slate-200 px-4 py-2.5 rounded-2xl shadow-sm text-[11px] font-black text-slate-700 hover:border-indigo-400 hover:shadow-md item-enter text-center';
            el.draggable = true;
            el.textContent = item.t;
            el.dataset.title = item.t;
            
            el.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', item.t);
                el.style.opacity = "0.4";
            });
            el.addEventListener('dragend', () => el.style.opacity = "1");
            return el;
        }

        document.querySelectorAll('.drop-zone').forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('drag-over');
            });
            zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                const title = e.dataTransfer.getData('text/plain');
                const el = document.querySelector(`[data-title="${title}"]`);
                
                if (el) {
                    const sourceContainer = el.parentElement;
                    const targetContainer = zone.querySelector('.slot-container');
                    
                    if (sourceContainer === targetContainer) return;

                    targetContainer.appendChild(el);

                    // Eğer havuzdan geldiyse havuzu doldur
                    if (sourceContainer.id === 'active-pool') {
                        activeItems = activeItems.filter(i => i.t !== title);
                        refillPool();
                    }
                }
            });
        });

        document.getElementById('finish-btn').addEventListener('click', () => {
            let corrects = 0;
            userMistakes = [];
            
            document.querySelectorAll('.drop-zone').forEach(zone => {
                const sultan = zone.dataset.sultan;
                zone.querySelectorAll('.draggable').forEach(item => {
                    const original = database.find(d => d.t === item.dataset.title);
                    if (original.s === sultan) {
                        item.className = 'p-3 rounded-xl text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 w-full mb-1 shadow-sm';
                        corrects++;
                    } else {
                        item.className = 'p-3 rounded-xl text-[10px] font-bold bg-red-50 text-red-700 border border-red-200 w-full mb-1 shadow-sm';
                        userMistakes.push({
                            reform: original.t,
                            userChoice: sultan,
                            correctChoice: original.s
                        });
                    }
                });
            });

            document.getElementById('finish-btn').classList.add('hidden');
            const finalMsg = document.getElementById('final-msg');
            finalMsg.classList.remove('hidden');
            document.getElementById('stats-text').textContent = `${database.length} ıslahattan ${corrects} tanesini doğru yerleştirdin.`;
            
            if (userMistakes.length === 0) {
                document.getElementById('report-btn').classList.add('hidden');
            }
        });

        document.getElementById('report-btn').addEventListener('click', () => {
            let report = "RUHİ ATAKAN BEKMEZCİ - ISLAHAT HATA RAPORU\n";
            report += "-------------------------------------------\n\n";
            userMistakes.forEach((m, i) => {
                report += `${i + 1}. Hatalı Eşleştirme:\n`;
                report += `   Islahat: ${m.reform}\n`;
                report += `   Senin Seçimin: ${m.userChoice}\n`;
                report += `   Doğru Padişah: ${m.correctChoice}\n\n`;
            });
            report += `Toplam Yanlış: ${userMistakes.length}\n`;
            report += `Tarih: ${new Date().toLocaleString('tr-TR')}\n`;
            report += "\nKomando disipliniyle bir sonraki denemede full bekliyoruz!";

            const blob = new Blob([report], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'islahat_analiz_raporu.txt';
            a.click();
            URL.revokeObjectURL(url);
        });

        init();
    </script>
